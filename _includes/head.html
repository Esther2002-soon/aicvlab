<meta charset="utf-8">
<title>{{ site.title }} | {{ site.data.lab.university }}</title>
<meta name="description" content="{{ site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
<script>
  (function () {
    var t;
    var m = window.location.search.match(/[?&]theme=(light|dark)\b/);
    if (m) { t = m[1]; }
    if (!t) { try { t = localStorage.getItem('van-theme'); } catch (e) {} }
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var l;
    var ml = window.location.search.match(/[?&]lang=(en|zh)\b/);
    if (ml) { l = ml[1]; }
    if (!l) { try { l = localStorage.getItem('lab-lang'); } catch (e) {} }
    if (l !== 'zh') { l = 'en'; }
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-Hant' : 'en');
  })();
</script>

<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
