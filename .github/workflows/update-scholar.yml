name: Update publications from Google Scholar

on:
  schedule:
    # GitHub often delays or silently drops scheduled runs, so the job is triggered
    # four times a day. Only the first one that actually runs each UTC day fetches
    # data (see "Already fetched today?"), so SerpApi is still used about once a day.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab, always fetches

permissions:
  contents: write           # commit the refreshed JSON files
  actions: write            # start the site build after a commit (see last step)

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Today's date (UTC)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Already fetched today?
        id: done
        uses: actions/cache@v4
        with:
          path: .scholar-stamp
          key: scholar-fetched-${{ steps.day.outputs.day }}

      - name: Fetch Google Scholar data
        id: fetch
        if: github.event_name != 'schedule' || steps.done.outputs.cache-hit != 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}   # optional, defaults to mXUOEzwAAAAJ
        run: |
          python scripts/fetch_scholar.py --data-dir _data
          echo "fetched" > .scholar-stamp

      - name: Commit changes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_publications.json _data/scholar_stats.json
          git commit -m "Update publications from Google Scholar"
          git push

      # Commits pushed with the default GITHUB_TOKEN do not start other workflows,
      # so the site build is started explicitly.
      - name: Rebuild the site
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-pages.yml --ref "${{ github.ref_name }}"
